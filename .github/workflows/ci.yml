name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Pilot smoke script tests
        run: node --test scripts/pilot-smoke.test.mjs
      - run: npm run test
      - run: npm run lint
      - name: SQL migrations and integration tests
        run: bash supabase/tests/run.sh
      - name: Build API Docker image
        run: docker build --tag mtandao-cloud-api:ci .
