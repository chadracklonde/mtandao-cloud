name: Supabase keep-alive

# A free Supabase project is paused after about a week without activity.
# This job sends one request to the database every three days. It uses only the
# public "publishable" key; it needs no secret and gets no access to any data:
# Postgres itself answers "permission denied" (42501), which proves the database
# is awake. Any other answer (project paused, outage) fails the run, and GitHub
# then notifies the repository owner.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://supzoqcfzwrxdfbtqdzo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_U2Njqhj2t8eDmxzRelG9nQ_lYqGUcKv
        run: |
          status=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/sites?select=id&limit=1")
          echo "HTTP ${status}"
          if [ "$status" = "200" ] || { [ "$status" = "401" ] && grep -q '"code":"42501"' response.json; }; then
            echo "Database reachable."
          else
            cat response.json
            echo "Unexpected answer: the project may be paused or down." >&2
            exit 1
          fi
